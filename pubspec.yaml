name: habitosapp
description: Aplicación de hábitos diarios con base de datos local (SQLite) y shared_preferences.
version: 2.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Añadidas con: flutter pub add shared_preferences sqflite path
  shared_preferences: ^2.3.0 # guarda la sesión (usuario que ha entrado)
  sqflite: ^2.3.3 # base de datos SQLite local
  path: ^1.9.0 # para construir la ruta del archivo de la base de datos

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
